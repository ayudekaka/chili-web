/* =========================================================
   CHILI — WHITE / RED PREMIUM TOKEN WEBSITE
   ========================================================= */

:root {
    --white: #ffffff;
    --black: #111111;
    --gray-1: #555555;
    --gray-2: #888888;
    --gray-3: #dddddd;
    --light: #f7f7f5;
    --red: #e71919;
    --red-dark: #c91414;

    --max-width: 1240px;
    --radius: 22px;
}

/* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--white);
    color: var(--black);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    line-height: 1.5;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

img {
    max-width: 100%;
    display: block;
}

/* ---------- CONTAINER ---------- */

.container {
    width: min(var(--max-width), calc(100% - 48px));
    margin: 0 auto;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(16px);

    border-bottom: 1px solid rgba(0,0,0,0.06);
}

.navbar {
    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.04em;
}

.brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.brand span {
    color: var(--black);
}

.brand strong {
    color: var(--red);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 30px;

    font-size: 14px;
    font-weight: 700;
}

.nav-links a {
    position: relative;
    color: #333;

    transition:
        color .2s ease;
}

.nav-links a:hover {
    color: var(--red);
}

.nav-links a::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: -7px;

    width: 0;
    height: 2px;

    background: var(--red);

    transition: width .2s ease;
}

.nav-links a:hover::after {
    width: 100%;
}

.nav-buy {
    background: var(--red);
    color: white !important;

    padding: 11px 18px;
    border-radius: 999px;
}

.nav-buy:hover {
    background: var(--red-dark);
}

.nav-buy::after {
    display: none;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
    min-height: calc(100vh - 78px);

    display: flex;
    align-items: center;

    padding: 80px 0 100px;

    position: relative;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.05fr .95fr;

    align-items: center;

    gap: 70px;
}

.hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    color: var(--red);

    font-size: 13px;
    font-weight: 800;

    letter-spacing: .13em;
    text-transform: uppercase;

    margin-bottom: 25px;
}

.hero-eyebrow::before {
    content: "";

    width: 30px;
    height: 2px;

    background: var(--red);
}

.hero h1 {
    font-size: clamp(72px, 9vw, 145px);

    line-height: .82;

    font-weight: 950;

    letter-spacing: -.085em;

    margin-left: -7px;
}

.hero h1 span {
    display: block;
}

.hero h1 .red {
    color: var(--red);
}

.hero-subtitle {
    max-width: 530px;

    margin-top: 35px;

    color: var(--gray-1);

    font-size: 19px;
    line-height: 1.65;
}

.hero-subtitle strong {
    color: var(--black);
}

.hero-buttons {
    display: flex;
    gap: 12px;

    margin-top: 35px;

    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 50px;

    padding: 0 24px;

    border-radius: 999px;

    font-size: 14px;
    font-weight: 800;

    transition:
        transform .2s ease,
        background .2s ease,
        color .2s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn-primary {
    background: var(--red);
    color: white;
}

.btn-primary:hover {
    background: var(--red-dark);
}

.btn-outline {
    border: 1px solid #222;
    color: var(--black);
    background: white;
}

.btn-outline:hover {
    border-color: var(--red);
    color: var(--red);
}

/* ---------- HERO LOGO ---------- */

.hero-visual {
    position: relative;

    min-height: 520px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-circle {
    width: min(470px, 80vw);
    aspect-ratio: 1;

    border
