<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHILI — BNB Chain</title>

<meta name="description" content="CHILI — A community-driven token on BNB Chain.">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at 50% -10%, rgba(255, 75, 20, 0.20), transparent 38%), #080808;
  color: #fff;
  line-height: 1.6;
  width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.container {
  width: min(1180px, calc(100% - 40px));
  margin: auto;
  max-width: 100%;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  backdrop-filter: blur(18px);
  background: rgba(8, 8, 8, 0.82);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

.nav {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: 1000;
  letter-spacing: -1px;
}

.logo-mark {
  width: 39px;
  height: 39px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff4212, #ff9200);
  box-shadow: 0 0 30px rgba(255,75,20,0.30);
  flex-shrink: 0;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  color: #aaa;
  font-size: 14px;
}

.nav-links a:hover {
  color: #fff;
}

.language {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.035);
}

.language button {
  border: none;
  background: transparent;
  color: #777;
  cursor: pointer;
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.language button.active {
  color: #fff;
  background: linear-gradient(135deg, #ff4212, #ff8500);
}

.nav-buy {
  padding: 10px 18px;
  border-radius: 999px;
  color: #fff !important;
  background: linear-gradient(135deg, #ff4212, #ff8500);
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(255,75,15,0.18);
}

/* 移动端菜单按钮 */
.menu-toggle {
  display: none;
  flex-direction: column;
  justify-content: space-between;
  width: 28px;
  height: 20px;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 1001;
}

.menu-toggle span {
  display: block;
  width: 100%;
  height: 2px;
  background: #fff;
  border-radius: 2px;
  transition: 0.3s;
}

/* =========================
   HERO
========================= */

.hero {
  min-height: 730px;
  display: flex;
  align-items: center;
  padding: 100px 0 90px;
  position: relative;
  overflow: hidden; /* 防止伪元素溢出产生滚动 */
}

.hero::after {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  right: -230px;
  top: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,70,15,0.16), transparent 70%);
  pointer-events: none;
}

.hero-content {
  max-width: 850px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.035);
  border-radius: 999px;
  color: #aaa;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 25px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #43df76;
  box-shadow: 0 0 12px rgba(67,223,118,0.8);
}

.hero h1 {
  font-size: clamp(64px, 13vw, 155px);
  line-height: .82;
  letter-spacing: -6px;
  font-weight: 1000;
  margin-bottom: 32px;
  background: linear-gradient(135deg, #fff 20%, #ff5a1a 70%, #ff9b00);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero h2 {
  font-size: clamp(24px, 4vw, 46px);
  line-height: 1.1;
  max-width: 780px;
  margin-bottom: 22px;
  letter-spacing: -1px;
}

.hero p {
  color: #999;
  max-width: 680px;
  font-size: 17px;
  line-height: 1.85;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 900;
  transition: .2s;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-primary {
  background: linear-gradient(135deg, #ff4212, #ff8500);
  box-shadow: 0 12px 35px rgba(255,75,15,0.20);
}

.btn-secondary {
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04);
}

/* =========================
   SECTIONS
========================= */

section {
  padding: 100px 0;
  max-width: 100%;
}

.section-label {
  color: #ff681c;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.section-title {
  font-size: 38px;
  letter-spacing: -1px;
  margin-bottom: 30px;
}

/* =========================
   MARKET
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
}

.stat {
  min-height: 145px;
  padding: 25px;
  border-radius: 19px;
  background: linear-gradient(145deg, rgba(255,255,255,0.065), rgba(255,255,255,0.025));
  border: 1px solid rgba(255,255,255,0.08);
}

.stat-name {
  color: #777;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 12px;
}

.stat-value {
  font-size: 28px;
  font-weight: 1000;
  letter-spacing: -.8px;
  word-break: break-word;
}

.green {
  color: #43df78;
}

.red {
  color: #ff5353;
}

.market-box {
  margin-top: 25px;
  padding: 25px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.025);
  max-width: 100%;
}

.market-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 8px;
}

.market-status {
  color: #777;
  font-size: 12px;
}

.market-status.live {
  color: #43df78;
}

.market-data {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.market-item {
  padding: 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.20);
  word-break: break-word;
}

.market-item span {
  display: block;
  color: #666;
  font-size: 11px;
  margin-bottom: 5px;
}

.market-item strong {
  font-size: 15px;
  word-break: break-all;
}

/* =========================
   ABOUT
========================= */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.card {
  padding: 36px;
  border-radius: 22px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  word-break: break-word;
}

.card h3 {
  font-size: 25px;
  margin-bottom: 13px;
}

.card p {
  color: #969696;
  line-height: 1.9;
}

/* =========================
   TOKEN
========================= */

.token-box {
  padding: 35px;
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(255,75,20,0.09), rgba(255,255,255,0.025));
  border: 1px solid rgba(255,255,255,0.08);
  max-width: 100%;
}

.token-row {
  display: grid;
  grid-template-columns: 170px 1fr auto;
  align-items: center;
  gap: 15px;
  padding: 18px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.token-row:last-child {
  border-bottom: none;
}

.token-label {
  color: #777;
  font-size: 12px;
  font-weight: 800;
}

.token-value {
  color: #ddd;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  word-break: break-all;
  overflow-wrap: break-word;
  min-width: 0; /* 防止网格溢出 */
}

.copy {
  border: none;
  color: #fff;
  background: rgba(255,255,255,0.07);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}

/* =========================
   TRADE
========================= */

.trade-card {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 25px;
  padding: 35px;
  border-radius: 25px;
  background: linear-gradient(135deg, rgba(255,70,15,0.11), rgba(255,255,255,0.025));
  border: 1px solid rgba(255,255,255,0.08);
  max-width: 100%;
}

.trade-card h3 {
  font-size: 36px;
  margin-bottom: 12px;
}

.trade-card p {
  color: #999;
  max-width: 600px;
  line-height: 1.85;
  margin-bottom: 25px;
}

.trade-info {
  padding: 24px;
  border-radius: 18px;
  background: rgba(0,0,0,0.23);
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 13px;
}

.info-row:last-child {
  border-bottom: none;
}

.info-row span {
  color: #777;
}

.info-row strong {
  text-align: right;
  word-break: break-all;
  overflow-wrap: break-word;
  min-width: 0;
}

/* =========================
   COMMUNITY
========================= */

.community {
  text-align: center;
  padding: 110px 0;
  max-width: 100%;
}

.community h2 {
  font-size: clamp(38px, 7vw, 75px);
  line-height: 1;
  letter-spacing: -3px;
  margin-bottom: 20px;
}

.community p {
  color: #888;
  max-width: 650px;
  margin: 0 auto 28px;
  line-height: 1.8;
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 30px 0 40px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 13px;
  color: #666;
  max-width: 100%;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

/* 平板及以下 */
@media (max-width: 900px) {
  .menu-toggle {
    display: flex;
  }

  .nav-links {
    position: absolute;
    top: 76px;
    left: 0;
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    background: rgba(12, 12, 12, 0.96);
    backdrop-filter: blur(20px);
    padding: 24px 20px;
    gap: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    transform: translateY(-120%);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s ease-in-out;
    z-index: 1000;
  }

  .nav-links.active {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .nav-links > a:not(.nav-buy) {
    display: block;
    font-size: 18px;
    font-weight: 600;
    width: 100%;
    padding: 10px 0;
  }

  .nav-buy {
    width: 100%;
    text-align: center;
    padding: 14px 18px;
    margin-top: 6px;
  }

  .language {
    width: 100%;
    justify-content: center;
  }
  .language button {
    padding: 10px 16px;
    font-size: 14px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .about-grid {
    grid-template-columns: 1fr;
  }

  .trade-card {
    grid-template-columns: 1fr;
  }
}

/* 手机大屏（600px 以下） */
@media (max-width: 600px) {
  .container {
    width: calc(100% - 28px);
  }

  .nav {
    height: 68px;
  }

  .hero {
    padding: 70px 0 60px;
    min-height: auto;
  }
  .hero h1 {
    font-size: 58px;
    letter-spacing: -3px;
  }
  .hero h2 {
    font-size: 24px;
  }
  .hero p {
    font-size: 15px;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat {
    min-height: auto;
    padding: 20px;
  }
  .stat-value {
    font-size: 24px;
  }

  .market-data {
    grid-template-columns: 1fr 1fr;
  }

  .token-box,
  .trade-card,
  .card {
    padding: 20px;
  }

  .token-row {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .token-row .copy {
    width: 100%;
    text-align: center;
    justify-content: center;
    padding: 12px;
  }

  .trade-card h3 {
    font-size: 28px;
  }

  .btn {
    width: 100%;
    justify-content: center;
    padding: 16px 22px;
  }
  .buttons {
    flex-direction: column;
  }
  .buttons .btn {
    width: 100%;
  }

  .community h2 {
    font-size: 38px;
    letter-spacing: -1px;
  }

  .footer {
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }

  section {
    padding: 70px 0;
  }
}

/* 手机小屏（480px 以下）– 主力优化 */
@media (max-width: 480px) {
  .hero h1 {
    font-size: 42px;
    letter-spacing: -2px;
    margin-bottom: 20px;
  }
  .hero h2 {
    font-size: 20px;
  }
  .hero p {
    font-size: 14px;
    line-height: 1.7;
  }
  .badge {
    font-size: 10px;
    padding: 5px 10px;
    margin-bottom: 18px;
  }

  .section-title {
    font-size: 28px;
    margin-bottom: 20px;
  }

  .stats {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .stat {
    padding: 16px 18px;
  }
  .stat-value {
    font-size: 22px;
  }

  .market-data {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .market-item {
    padding: 12px;
  }
  .market-item strong {
    font-size: 14px;
  }

  .token-box {
    padding: 16px;
  }
  .token-row {
    padding: 14px 0;
  }
  .token-value {
    font-size: 12px;
  }
  .copy {
    padding: 12px;
    font-size: 13px;
  }

  .trade-card {
    padding: 16px;
  }
  .trade-card h3 {
    font-size: 24px;
  }
  .trade-card p {
    font-size: 14px;
  }
  .trade-info {
    padding: 16px;
  }
  .info-row {
    font-size: 12px;
    padding: 10px 0;
  }

  .card {
    padding: 20px;
  }
  .card h3 {
    font-size: 22px;
  }
  .card p {
    font-size: 14px;
  }

  .community {
    padding: 60px 0;
  }
  .community h2 {
    font-size: 32px;
  }
  .community p {
    font-size: 14px;
  }

  .footer {
    font-size: 12px;
  }
}

/* 极窄屏（400px 以下） */
@media (max-width: 400px) {
  .hero h1 {
    font-size: 34px;
    letter-spacing: -1px;
  }
  .hero h2 {
    font-size: 18px;
  }
  .market-data {
    grid-template-columns: 1fr;
  }
  .stat-value {
    font-size: 20px;
  }
  .section-title {
    font-size: 24px;
  }
}
</style>
</head>
